<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Samson | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">
           <img src="Internship.png" alt="Logo" style="width: 48px; height: 48px; max-width: 48px; object-fit: contain;">
           <span>ajsamson.</span>
         </a>   
            <nav class="navbar">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="skills.html" class="nav-link">Skills</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="achievements.html" class="nav-link">Achievements</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
                <button id="mobile-menu" class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="page-container">
        <div class="card-box" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 3rem; max-width: 1000px; margin: 0 auto;">
            <div>
                <span class="section-number">05 / LET'S CONNECT</span>
                <h1 style="font-size: 2.2rem; margin: 1rem 0;">Let's Connect</h1>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Have a project or opportunity in mind? Email me at <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=samsonaj822@gmail.com&amp;su=Portfolio%20inquiry" target="_blank" rel="noopener noreferrer" style="color: var(--accent); font-weight: 600;">samsonaj822@gmail.com</a>, or send a message using the form.</p>
            </div>
            <form id="contact-form" action="https://formspree.io/f/xnpdnlyr" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="hidden" name="_subject" value="New message from your portfolio">
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="name" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Your name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.85rem; border-radius: 10px; color: var(--text-main);">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="email" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.85rem; border-radius: 10px; color: var(--text-main);">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="message" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Message</label>
                    <textarea id="message" name="message" rows="3" required style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.85rem; border-radius: 10px; color: var(--text-main); font-family: inherit;"></textarea>
                </div>
                <button type="submit" class="btn primary-btn" style="justify-content: center;">Send Message <i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </main>

    <footer class="footer"><div class="footer-flex"><p>&copy; 2026 AJ Dela Cruz Samson.</p></div></footer>
    <script src="script.js"></script>
</body>
</html>
